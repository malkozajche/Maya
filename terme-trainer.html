<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Terme-Trainer</title>
<style>:root{--blue:#3b82f6;--orange:#f97316;--green:#22c55e;--red:#ef4444;--purple:#7c5cff;--bg:#eef2ff;--ink:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#e0e7ff 0%,#fdf4ff 100%);background-attachment:fixed;color:var(--ink);font-size:18px;min-height:100vh;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(80,70,200,.12)}
header .title{font-weight:900;font-size:20px;color:var(--purple);cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.08);white-space:nowrap}
.pill.fire{color:#ea580c}
.pbar{height:6px;background:#e5e7eb;position:absolute;left:0;right:0;bottom:0}
.pbar>div{height:100%;background:linear-gradient(90deg,#facc15,#f97316);width:0;transition:width .6s}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.back{border:0;background:#fff;border-radius:14px;font-size:22px;width:48px;height:48px;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer}
/* Maskottchen */
.mascot{display:flex;align-items:flex-end;gap:8px;margin:6px 0 10px}
.mascot svg{flex:0 0 auto;width:72px;height:72px}
.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 14px;font-size:19px;font-weight:700;box-shadow:0 2px 8px rgba(80,70,200,.15);flex:1;min-height:48px;display:block;line-height:1.35;animation:pop .35s}
.bubble:before{content:"";position:absolute;left:-10px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bounce{animation:bounce .6s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
/* Startseite */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:640px){.levels{grid-template-columns:repeat(4,1fr)}}
.lv{border:0;border-radius:22px;padding:12px 6px;background:#fff;box-shadow:0 3px 0 rgba(80,70,200,.25),0 4px 12px rgba(80,70,200,.12);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;transition:transform .15s}
.lv:active{transform:scale(.95)}
.lv .ic{font-size:40px;line-height:1.1}
.lv .nm{font-size:14px;font-weight:800;text-align:center;line-height:1.15}
.lv.done{background:#ecfdf5}
.lv.next{outline:4px solid var(--orange);animation:pulse 1.6s infinite}
.stars{color:#facc15;font-size:18px;letter-spacing:1px}
.stars .off{color:#d1d5db}
.reset{display:block;margin:28px auto 0;border:0;background:none;color:#94a3b8;font-size:15px;text-decoration:underline;cursor:pointer;padding:12px}
/* Level-Kopf */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lhead h2{margin:0;font-size:21px;flex:1}
.phases{display:flex;gap:6px;justify-content:center;margin:6px 0}
.phases span{font-size:14px;font-weight:800;padding:5px 10px;border-radius:999px;background:#fff;color:#94a3b8}
.phases span.on{background:var(--purple);color:#fff}
.phases span.ok{background:var(--green);color:#fff}
.panel{background:#fff;border-radius:22px;padding:12px;box-shadow:0 2px 12px rgba(80,70,200,.12);margin:10px 0}
/* Figur */
.stage{background:#fffdf7;border-radius:18px;border:3px solid #fde68a;padding:8px;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{max-width:100%;height:auto;max-height:230px}
.count{font-size:46px;font-weight:900;text-align:center;line-height:1.1;margin:6px 0 0}
.count small{font-size:20px;font-weight:800;color:#64748b}
.count.bump{animation:bump .4s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.calc{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 2px;min-height:40px}
.chip{border-radius:12px;padding:5px 10px;font-weight:900;font-size:22px;color:#fff;animation:pop .35s}
.chip.b{background:var(--blue);color:#fff}.chip.o{background:var(--orange);color:#fff;padding:5px 10px}.chip.g{background:#16a34a}.chip.r{background:#e11d48}.chip.n{background:#64748b}
.chip.eq{background:none;color:var(--ink)}
.compact{text-align:center;font-size:26px;font-weight:900;min-height:38px;animation:pop .5s}
.o{color:var(--orange);background:#ffedd5;border-radius:8px;padding:0 6px}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0 4px}
.big{border:0;border-radius:20px;font-size:24px;font-weight:900;padding:16px 22px;min-height:64px;cursor:pointer;color:#fff;background:var(--orange);box-shadow:0 5px 0 #c2410c;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #c2410c}
.big.green{background:var(--green);box-shadow:0 5px 0 #15803d}
.big.purple{background:var(--purple);box-shadow:0 5px 0 #5b3fd6}
.big.ghost{background:#fff;color:#64748b;box-shadow:0 4px 0 #cbd5e1;font-size:22px;min-width:64px;padding:16px}
.big.wide{width:100%}
.big:disabled{opacity:.4}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #15803d,0 0 0 0 rgba(34,197,94,.6)}50%{box-shadow:0 5px 0 #15803d,0 0 0 12px rgba(34,197,94,0)}}
/* Sticks */
.stk line.w{stroke-width:8;stroke-linecap:round}
.stk.b line.w{stroke:#2563eb}.stk.o line.w{stroke:#f97316}.stk.n line.w{stroke:#a16207}
.stk circle{fill:#dc2626}
.stk.fly{animation:fly .6s cubic-bezier(.2,.8,.3,1.2) both}
.stk.glow line.w{filter:drop-shadow(0 0 4px #fb923c)}
@keyframes fly{0%{transform:translate(40px,-60px) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.flash line.w{animation:flash 1s 3}
@keyframes flash{50%{stroke:#facc15}}
/* Quiz */
.q{font-size:24px;font-weight:900;text-align:center;margin:6px 0 12px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border:0;border-radius:999px;font-size:30px;font-weight:900;min-height:76px;background:#fff;color:var(--ink);box-shadow:0 5px 0 #c7d2fe,0 2px 10px rgba(80,70,200,.15);cursor:pointer}
.ans:active{transform:translateY(3px)}
.ans.right{background:var(--green);color:#fff;box-shadow:0 5px 0 #15803d;animation:bump .4s}
.ans.wrong{background:#fee2e2;color:#b91c1c;box-shadow:0 5px 0 #fca5a5;animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.dots{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e2e8f0;display:block}
.dots i.ok{background:var(--green)}.dots i.on{background:var(--purple)}
/* Baukasten */
.plan{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:21px;font-weight:800;align-items:center;max-width:420px;margin:0 auto}
.plan .lab{color:#64748b;text-align:right;font-size:17px}
.plan .xrow{color:var(--purple)}
.slot{min-height:72px;border:3px dashed #a5b4fc;border-radius:18px;background:#f8faff;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:8px;margin:8px 0}
.slot .tok{border:0;border-radius:12px;font-size:28px;font-weight:900;padding:6px 12px;background:#e0e7ff;color:#3730a3;cursor:pointer;animation:pop .25s}
.slot .tok.x{background:#ffedd5;color:#c2410c}
.slot .ph{color:#a5b4fc;font-weight:800;font-size:18px}
.slot.good{border-color:var(--green);background:#f0fdf4;border-style:solid}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{border:0;border-radius:16px;font-size:28px;font-weight:900;min-height:60px;background:#fff;color:#3730a3;box-shadow:0 4px 0 #c7d2fe;cursor:pointer}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #c7d2fe}
.tile.x{background:#fff7ed;color:#c2410c;box-shadow:0 4px 0 #fdba74}
.tile.op{background:#f1f5f9;color:#334155;box-shadow:0 4px 0 #cbd5e1}
.tile.del{background:#fee2e2;color:#b91c1c;box-shadow:0 4px 0 #fca5a5}
.live{width:100%;border-collapse:separate;border-spacing:4px;margin-top:8px;font-size:18px;font-weight:800;text-align:center}
.live td,.live th{background:#f8fafc;border-radius:10px;padding:6px 2px}
.live th{color:#64748b;font-size:15px}
.live td.ok{background:#dcfce7;color:#15803d}.live td.no{background:#fee2e2;color:#b91c1c}
.typebox{display:flex;gap:8px;margin-top:8px}
.typebox input{flex:1;font-size:24px;padding:10px;border-radius:14px;border:3px solid #c7d2fe;font-family:inherit;min-width:0}
.linkbtn{border:0;background:none;color:var(--purple);font-weight:800;font-size:17px;padding:10px;cursor:pointer;text-decoration:underline}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.hintbtn{border:0;background:#fef9c3;color:#854d0e;font-weight:900;border-radius:999px;padding:10px 16px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #fde047}
/* Erfolg */
.win{text-align:center}
.win .stars{font-size:54px}
.win h2{font-size:30px;margin:4px 0}
.proof{font-size:20px;font-weight:800;margin:8px 0}
/* Karten */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:900px}
.card3d{position:relative;min-height:110px;border:0;background:none;padding:0;cursor:pointer}
.card3d .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.card3d .f,.card3d .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;padding:6px}
.card3d .f{background:#fff;font-size:24px;box-shadow:0 5px 0 #c7d2fe;color:#3730a3}
.card3d .bk{transform:rotateY(180deg);font-size:20px;color:#fff}
.card3d .bk.yes{background:var(--green)}.card3d .bk.no{background:var(--red)}
.card3d .bk small{font-size:14px;font-weight:700}
.termbig{font-size:36px;font-weight:900;text-align:center;color:#3730a3;background:#eef2ff;border-radius:18px;padding:12px;margin:6px 0}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:18px;font-size:20px;font-weight:800;padding:14px;background:#fff;box-shadow:0 4px 0 #c7d2fe;text-align:left;cursor:pointer;color:var(--ink);min-height:60px}
.opt.right{background:var(--green);color:#fff;box-shadow:0 4px 0 #15803d}
.opt.wrong{background:#fee2e2;color:#b91c1c;animation:shake .45s}
.hidden{display:none!important}
/* Konfetti */
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:100;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* Wortlevel-Visuals */
.coin{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-weight:900;font-size:15px;margin:3px;animation:pop .35s}
.coin.o{background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b);color:#7c2d12;border:3px solid #d97706}
.coin.b{background:radial-gradient(circle at 35% 35%,#dbeafe,#60a5fa);color:#1e3a8a;border:3px solid #2563eb}
.vis{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}
.ticket{background:#ffedd5;border:3px dashed var(--orange);border-radius:10px;padding:4px 8px;font-weight:900;font-size:16px;animation:pop .35s}
.ticket.b{background:#dbeafe;border-color:var(--blue)}
.mblock{background:var(--orange);color:#fff;border-radius:8px;padding:6px 6px;font-weight:900;font-size:13px;animation:pop .35s}
.mblock.b{background:var(--blue);font-size:16px}
.lbl{font-size:14px;font-weight:800;color:#64748b;width:100%;text-align:center}
@media (max-width:420px){
  body{font-size:17px}
  .count{font-size:40px}
  .q{font-size:21px}
  .ans{font-size:26px;min-height:68px}
  .tile{font-size:24px;min-height:56px}
  .big{font-size:21px;padding:14px 16px}
  .mascot svg{width:60px;height:60px}
  .bubble{font-size:17px}
  .chip{font-size:19px;padding:4px 8px}
  .compact{font-size:22px}
}

.pulse-o{animation:pulseo 1.3s infinite}
@keyframes pulseo{0%,100%{box-shadow:0 5px 0 #c2410c,0 0 0 0 rgba(249,115,22,.6)}50%{box-shadow:0 5px 0 #c2410c,0 0 0 14px rgba(249,115,22,0)}}

.mascot.sticky{position:sticky;top:58px;z-index:15;margin:4px -12px 6px;padding:6px 12px;background:linear-gradient(180deg,rgba(238,242,255,.97) 70%,rgba(238,242,255,0))}
@media (max-width:420px){.mascot.sticky{top:54px}}
</style>
</head>
<body>
<header><div class="title" id="title">🧮 Terme-Trainer</div><div class="pill fire" id="fire" title="Serie richtiger Antworten">🔥 0</div><div class="pill" id="stars">⭐ 0</div><div class="pbar"><div id="bar"></div></div></header>
<main id="main"></main>
<script>/* ===== Terme-Trainer: Parser & Checker (auch in Node testbar) ===== */
var TermCore = (function () {
  function normalize(s) {
    s = String(s == null ? '' : s);
    if (s.indexOf('=') >= 0) s = s.slice(s.lastIndexOf('=') + 1);   // "T = 3x+1" -> "3x+1"
    s = s.replace(/[·•⋅×✕*]/g, '*').replace(/[÷:]/g, '/')
         .replace(/[−–—]/g, '-').replace(/X/g, 'x').replace(/²/g, '^2')
         .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')');
    s = s.replace(/(\d)\s*,\s*(\d)/g, '$1.$2');                      // Dezimalkomma
    s = s.replace(/€|cm²|cm|m²/g, '');
    return s.replace(/\s+/g, '');
  }
  function tokenize(s) {
    var t = [], i = 0, m;
    while (i < s.length) {
      var c = s[i];
      if ((m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))) { t.push({ k: 'num', v: parseFloat(m[1]) }); i += m[1].length; continue; }
      if (c === 'x') { t.push({ k: 'x' }); i++; continue; }
      if ('+-*/^()'.indexOf(c) >= 0) { t.push({ k: c }); i++; continue; }
      if (c === ',') throw new Error('Komma an einer seltsamen Stelle – schreibe Dezimalzahlen wie 0,5.');
      if (/[a-wyzäöüß]/i.test(c)) throw new Error('Benutze bitte x als Variable (nicht „' + c + '“).');
      throw new Error('Das Zeichen „' + c + '“ kenne ich nicht.');
    }
    // implizite Multiplikation: 2x, 2(…), x(…), )(…), )x, x2? (nicht erlaubt -> 2x)
    var out = [];
    for (var j = 0; j < t.length; j++) {
      var a = out[out.length - 1], b = t[j];
      if (a && (a.k === 'num' || a.k === 'x' || a.k === ')') && (b.k === 'x' || b.k === '(' || (b.k === 'num' && a.k !== 'num')))
        out.push({ k: '*' });
      out.push(b);
    }
    return out;
  }
  function parse(str) {
    var s = normalize(str);
    if (!s) throw new Error('Das Feld ist noch leer.');
    var t = tokenize(s), p = 0;
    function peek() { return t[p] ? t[p].k : null; }
    function expr() {
      var n = term();
      while (peek() === '+' || peek() === '-') { var o = t[p++].k; n = { op: o, a: n, b: term() }; }
      return n;
    }
    function term() {
      var n = unary();
      while (peek() === '*' || peek() === '/') { var o = t[p++].k; n = { op: o, a: n, b: unary() }; }
      return n;
    }
    function unary() {
      if (peek() === '-') { p++; return { op: 'neg', a: unary() }; }
      if (peek() === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var n = atom();
      if (peek() === '^') { p++; n = { op: '^', a: n, b: unary() }; }
      return n;
    }
    function atom() {
      var k = peek();
      if (k === 'num') return { num: t[p++].v };
      if (k === 'x') { p++; return { x: true }; }
      if (k === '(') {
        p++; var n = expr();
        if (peek() !== ')') throw new Error('Da fehlt eine schließende Klammer „)“.');
        p++; return n;
      }
      if (k === ')') throw new Error('Da ist eine Klammer „)“ zu viel oder an der falschen Stelle.');
      if (k === null) throw new Error('Der Term hört mitten drin auf.');
      throw new Error('Hier fehlt eine Zahl oder x (vor „' + (k === '*' ? '·' : k) + '“).');
    }
    var tree = expr();
    if (p < t.length) throw new Error(t[p].k === ')' ? 'Da ist eine Klammer „)“ zu viel.' : 'Ich verstehe den Term nicht ganz – prüfe die Rechenzeichen.');
    return tree;
  }
  function hasX(n) { return !!(n && (n.x || hasX(n.a) || hasX(n.b))); }
  function evalTree(n, x) {
    if ('num' in n) return n.num;
    if (n.x) return x;
    switch (n.op) {
      case 'neg': return -evalTree(n.a, x);
      case '+': return evalTree(n.a, x) + evalTree(n.b, x);
      case '-': return evalTree(n.a, x) - evalTree(n.b, x);
      case '*': return evalTree(n.a, x) * evalTree(n.b, x);
      case '/': return evalTree(n.a, x) / evalTree(n.b, x);
      case '^': return Math.pow(evalTree(n.a, x), evalTree(n.b, x));
    }
    throw new Error('?');
  }
  function evaluate(str, x) { return evalTree(parse(str), x); }
  function same(a, b) { return isFinite(a) && isFinite(b) && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)); }
  function fmt(v) {
    if (!isFinite(v)) return '–';
    var r = Math.round(v * 1e6) / 1e6;
    return String(r).replace('-', '−').replace('.', ',');
  }
  function pretty(str) {
    return normalize(str).replace(/\*/g, ' · ').replace(/\//g, ' : ').replace(/\+/g, ' + ')
      .replace(/(\S)-/g, '$1 − ').replace(/-/g, '−').replace(/\./g, ',').replace(/\s+/g, ' ').trim();
  }
  /* Prüft einen Term gegen eine Ziel-Funktion. xs: Testwerte. */
  function check(str, target, xs) {
    xs = xs || [1, 2, 3, 4, 5, 10, 100];
    var tree;
    try { tree = parse(str); } catch (e) { return { status: 'error', message: e.message }; }
    var rows = xs.map(function (x) { var u = evalTree(tree, x), r = target(x); return { x: x, user: u, right: r, ok: same(u, r) }; });
    var good = rows.filter(function (r) { return r.ok; }), bad = rows.filter(function (r) { return !r.ok; });
    if (!bad.length) return { status: 'ok', rows: rows, message: 'Super, dein Term stimmt!' };
    if (!hasX(tree)) return { status: 'nox', rows: rows, message: 'In deinem Term kommt kein x vor. Der Term soll für jede Anzahl funktionieren – ersetze die Zahl, die sich ändert, durch x.' };
    var f = bad[0];
    if (good.length) {
      return { status: 'almost', rows: rows, message: 'Fast! Dein Term stimmt für x = ' + good.slice(0, 3).map(function (r) { return fmt(r.x); }).join(', ') +
        ', aber nicht für x = ' + fmt(f.x) + ' (dein Term ergibt ' + fmt(f.user) + ', richtig wäre ' + fmt(f.right) + ').' };
    }
    return { status: 'wrong', rows: rows, message: 'Noch nicht. Für x = ' + fmt(f.x) + ' ergibt dein Term ' + fmt(f.user) + ', richtig wäre ' + fmt(f.right) + '. Schau nochmal in deine Tabelle.' };
  }
  /* Prüft eine Rechnung ohne x (Tabellenzelle) */
  function checkNumber(str, expected) {
    var tree;
    try { tree = parse(str); } catch (e) { return { status: 'error', message: e.message }; }
    if (hasX(tree)) return { status: 'error', message: 'Hier bitte mit echten Zahlen rechnen, noch ohne x.' };
    var v = evalTree(tree, 0);
    return same(v, expected) ? { status: 'ok', value: v } : { status: 'wrong', value: v, message: 'Das ergibt ' + fmt(v) + ' – zähle nochmal nach.' };

    { story: 'Hölzer für x Quadrate?', fig: 'sq', f: function (x) { return 3 * x + 1; }, cards: ['4 · x', '4 + (x − 1) · 3', '3 · x + 1', 'x + 3'] }
  ];
  var REVERSE = [
    { term: '4 · x + 12', q: 'Fahrrad leihen, x Stunden. Was ist die 12?', opts: ['Preis pro Stunde', 'Fester Grundpreis', 'Anzahl Stunden', 'Preis für 12 Stunden'], ok: 1, why: '12 € zahlt man einmal. 4 € kostet jede Stunde.' },
    { term: '3 + 3 + x · 20', q: 'Perlenschlange. Was ist x · 20?', opts: ['Kopf und Schwanz', 'Perlen für den Körper', 'Länge der Schlange', 'Perlen pro cm'], ok: 1, why: 'x cm Körper mit je 20 Perlen.' },
    { term: '2 · x + 2 · (x + 3)', q: 'Rechteck mit Seiten x und x + 3. Was ist das?', opts: ['Fläche', 'Umfang (Rand)', 'Eine Seite', 'Diagonale'], ok: 1, why: '2 × die eine + 2 × die andere Seite = alle 4 Seiten.' },
    { term: '6 · x', q: 'Was passt zu diesem Term?', opts: ['x € plus 6 €', 'x Packungen mit je 6 Eiern', '6 Kinder teilen x Bonbons', 'x Minuten und 6 € Gebühr'], ok: 1, why: 'x-mal die 6 → x Packungen à 6 Eier.' },
    { term: '3 + (x − 1) · 2', q: 'Dreiecke. Wofür steht x − 1?', opts: ['Alle Dreiecke', 'Alle außer dem ersten', 'Das erste Dreieck', 'Ein weggenommenes Dreieck'], ok: 1, why: 'Das erste hat schon 3 Hölzer. Die anderen x − 1 bringen je 2.' }
  ];
  function tablesSVG(n) {
    var p = [], s = 50;
    for (var k = 0; k < n; k++) p.push('<rect x="' + (30 + k * s) + '" y="30" width="' + s + '" height="' + s + '" fill="#fde68a" stroke="#a16207" stroke-width="3"/><circle cx="' + (55 + k * s) + '" cy="15" r="9" fill="#7c5cff"/><circle cx="' + (55 + k * s) + '" cy="95" r="9" fill="#7c5cff"/>');
    p.push('<circle cx="15" cy="55" r="9" fill="#7c5cff"/><circle cx="' + (45 + n * s) + '" cy="55" r="9" fill="#7c5cff"/>');
    return '<svg viewBox="0 0 ' + (60 + n * s) + ' 110" width="' + (60 + n * s) * 1.4 + '">' + p.join('') + '</svg>';
  }

  /* ---------- Speicher ---------- */
  var KEY = 'termeTrainer.v2', state;
  function load() { try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; } state.levels = state.levels || {}; state.streak = state.streak || 0; state.best = state.best || 0; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } }
  function setStars(id, s) { var o = state.levels[id] || {}; o.done = true; o.stars = Math.max(o.stars || 0, s); state.levels[id] = o; save(); header(); }
  function streak(ok) { state.streak = ok ? state.streak + 1 : 0; state.best = Math.max(state.best, state.streak); save(); header(); }
  function header() {
    var t = 0, done = 0; LEVELS.forEach(function (l) { var s = state.levels[l.id]; if (s) { t += s.stars || 0; if (s.done) done++; } });
    $('#stars').textContent = '⭐ ' + t; $('#fire').textContent = '🔥 ' + state.streak;
    $('#bar').style.width = (100 * done / LEVELS.length) + '%';
  }
  function starsHTML(n) { var s = ''; for (var i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">★</span>'; return '<span class="stars">' + s + '</span>'; }

  /* ---------- Start ---------- */
  function home() {
    var next = LEVELS.findIndex(function (l) { return !(state.levels[l.id] && state.levels[l.id].done); });
    $('#main').innerHTML = mascotHTML(next === 0 ? 'Hi Maya! 👋 Tipp auf Level 1!' : next < 0 ? 'Alles geschafft! 🏆 Spiel nochmal!' : 'Weiter geht\u2019s mit Level ' + (next + 1) + '! 💪') +
      '<div class="levels">' + LEVELS.map(function (l, i) {
        var s = state.levels[l.id];
        return '<button class="lv' + (s && s.done ? ' done' : '') + (i === next ? ' next' : '') + '" data-go="' + i + '"><div class="ic">' + l.icon + '</div><div class="nm">' + (i + 1) + '. ' + l.title + '</div>' + starsHTML(s ? s.stars : 0) + '</button>';
      }).join('') + '</div><button class="reset" id="reset">Fortschritt löschen</button>';
    $$('[data-go]').forEach(function (b) { b.onclick = function () { openLevel(+b.dataset.go); }; });
    $('#reset').onclick = function () { if (confirm('Alle Sterne löschen?')) { state = { levels: {}, streak: 0, best: 0 }; save(); header(); home(); } };
    window.scrollTo(0, 0);
  }
  function openLevel(i) {
    var l = LEVELS[i];
    if (l.kind === 'match') matchLevel(i); else if (l.kind === 'reverse') reverseLevel(i); else playLevel(i);
    window.scrollTo(0, 0);
  }
  function lhead(i, l, phases) {
    return '<div class="lhead"><button class="back" data-home aria-label="Zurück">←</button><h2>' + l.icon + ' ' + l.title + '</h2></div>' +
      (phases ? '<div class="phases"><span id="ph1" class="on">🔨 Bauen</span><span id="ph2">❓ Raten</span><span id="ph3">🧩 Term</span></div>' : '');
  }
  function wire(i) { $$('[data-home]').forEach(function (b) { b.onclick = home; }); $$('[data-next]').forEach(function (b) { b.onclick = function () { openLevel(i + 1); }; }); }
  function phase(k) { for (var j = 1; j <= 3; j++) { var e = $('#ph' + j); if (e) e.className = j < k ? 'ok' : j === k ? 'on' : ''; } }

  /* ---------- Spiel-Level: Bauen → Raten → Term ---------- */
  function playLevel(i) {
    var l = LEVELS[i], n = l.start, adds = 0, wrongQ = 0, hints = 0;
    var resFmt = function (v) { return l.money ? money(v) : fmt(v); };
    $('#main').innerHTML = lhead(i, l, true) + mascotHTML(l.story).replace('class="mascot"', 'class="mascot sticky"') +
      '<div class="panel" id="build"><div class="stage" id="stage"></div>' +
      '<div class="count" id="count"></div><div class="calc" id="calc"></div><div class="compact" id="compact"></div>' +
      '<div class="ctrl"><button class="big ghost" id="minus" aria-label="weniger">−</button><button class="big pulse-o" id="plus">' + l.addLabel + '</button></div>' +
      '<button class="big green wide hidden" id="go2">Weiter ➜</button></div>' +
      '<div class="panel hidden" id="quiz"></div><div class="panel hidden" id="term"></div><div id="win"></div>';
    wire(i);
    function draw(fly) {
      $('#stage').innerHTML = l.visual(n, fly);
      var c = $('#count'); c.innerHTML = resFmt(l.f(n)) + ' <small>' + l.unitRes + '</small><div style="font-size:17px;color:#64748b;font-weight:800">' + l.lab(n) + '</div>';
      c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
      var ch = l.chips(n), shown = ch.length > 9 ? ch.slice(0, 4).concat([{ t: '…', c: 'n' }]).concat(ch.slice(-2)) : ch;
      $('#calc').innerHTML = shown.map(function (k) { return '<span class="chip ' + k.c + '">' + k.t + '</span>'; }).join('') + '<span class="chip eq">= ' + resFmt(l.f(n)) + '</span>';
      var cp = $('#compact'); cp.innerHTML = '';
      if (ch.length > 2 || l.kind === 'word') setTimeout(function () { cp.innerHTML = '= ' + l.compact(n); }, 450);
      $('#minus').disabled = n <= l.min; $('#plus').disabled = n >= l.max;
    }
    $('#plus').onclick = function () {
      if (n >= l.max) return; n += l.step; adds++; draw(true); $('#plus').classList.remove('pulse-o');
      if (l.kind === 'pattern') say(adds === 1 ? 'Die neuen Hölzer sind <span class="o">orange</span>. Wie viele?' : adds === 2 ? 'Immer <span class="o">+ ' + l.d + '</span>! 😮' : 'Super gebaut! 👍');
      else say(adds === 1 ? 'Schau: Was wird <span class="o">orange</span>?' : adds === 2 ? 'Nur die <span class="o">orange Zahl</span> ändert sich!' : 'Super! 👍');
      if (adds >= 3 && $('#go2').classList.contains('hidden')) { $('#go2').classList.remove('hidden'); $('#go2').classList.add('pulse'); say('Klasse! Tipp auf <b>Weiter</b>. 👉'); }
    };
    $('#minus').onclick = function () { if (n > l.min) { n -= l.step; draw(false); } };
    draw(false);
    say(l.story + ' Tipp auf <b>' + l.addLabel + '</b>!');
    $('#go2').onclick = startQuiz;

    function options(v) {
      var r = l.f(v), d = l.f(v + l.step) - r, c = [l.f(1) * v / (l.kind === 'pattern' ? 1 : l.step) , r - d, r + d, r + 1, r - 1, r + 2 * d, 2 * r];
      if (l.kind === 'pattern') c.unshift(l.a * v);
      var out = [r], seen = {}; seen[resFmt(r)] = 1;
      c.forEach(function (x) { x = Math.round(x * 100) / 100; if (out.length < 4 && x > 0 && !seen[resFmt(x)]) { seen[resFmt(x)] = 1; out.push(x); } });
      return shuffle(out);
    }
    function startQuiz() {
      $('#go2').classList.add('hidden'); phase(2);
      var qi = 0, box = $('#quiz'); box.classList.remove('hidden');
      function ask() {
        var v = l.quiz[qi], wrongHere = 0;
        box.innerHTML = '<div class="dots">' + l.quiz.map(function (_, k) { return '<i class="' + (k < qi ? 'ok' : k === qi ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
          '<div class="q">' + l.q(v) + '</div><div class="answers">' + options(v).map(function (o) { return '<button class="ans" data-v="' + o + '">' + resFmt(o) + '</button>'; }).join('') + '</div>';
        say(qi === 0 ? (v <= l.max ? 'Rate mal! Du kannst oben auch bauen.' : 'Rate mal! 🤔') : qi === 2 ? 'So weit kann man nicht bauen… 😅' : 'Und jetzt?');
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        $$('.ans', box).forEach(function (b) {
          b.onclick = function () {
            if (b.classList.contains('right') || b.classList.contains('wrong')) return;
            if (T.same(+b.dataset.v, l.f(v))) {
              b.classList.add('right'); streak(true); confetti(14);
              say(['Richtig! 🎉', 'Genau! ⭐', 'Wow! 🤩'][qi]);
              $$('.ans', box).forEach(function (x) { x.onclick = null; });
              setTimeout(function () { qi++; if (qi < l.quiz.length) ask(); else startTerm(); }, 1100);
            } else {
              b.classList.add('wrong'); wrongQ++; wrongHere++; streak(false);
              $$('.stk.o', $('#stage')).forEach(function (g) { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); });
              say(wrongHere === 1 ? (l.kind === 'pattern' ? 'Fast! Jedes neue ' + l.sing + ': <span class="o">+ ' + l.d + '</span>' : 'Fast! Schau auf die Rechnung oben.') : 'Rechne: ' + l.compact(v));
            }
          };
        });
      }
      ask();
    }
    function startTerm() {
      phase(3); $('#quiz').classList.add('hidden');
      var box = $('#term'); box.classList.remove('hidden');
      var tokens = [], typing = false, solved = false;
      box.innerHTML = '<div class="plan">' + l.plan.map(function (p) { return '<div class="lab">' + l.planLab(p) + '</div><div>' + l.compact(p) + '</div>'; }).join('') +
        '<div class="lab xrow">' + l.xLab + '</div><div class="xrow">?</div></div>' +
        '<div class="slot" id="slot"><span class="ph">Tippe die Bausteine ⬇</span></div>' +
        '<div class="tiles" id="tiles">' + l.tiles.map(function (t) { var cl = t === 'x' ? 'x' : /^[\d,]+$/.test(t) ? '' : 'op'; return '<button class="tile ' + cl + '" data-t="' + t + '">' + t + '</button>'; }).join('') +
        '<button class="tile del" data-t="⌫" aria-label="löschen">⌫</button></div>' +
        '<table class="live" id="live"></table><div class="row"><button class="hintbtn" id="hint">💡 Tipp</button><button class="linkbtn" id="typeT">⌨️ Selbst tippen</button></div>' +
        '<div class="typebox hidden" id="typebox"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="z. B. 2x + 1"></div>';
      say(l.bridge);
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      function expr() { return typing ? $('#typed').value : tokens.join(' '); }
      function render() {
        var s = $('#slot');
        if (!typing) {
          s.innerHTML = tokens.length ? tokens.map(function (t, k) { return '<button class="tok' + (t === 'x' ? ' x' : '') + '" data-k="' + k + '">' + t + '</button>'; }).join('') : '<span class="ph">Tippe die Bausteine ⬇</span>';
          $$('.tok', s).forEach(function (b) { b.onclick = function () { tokens.splice(+b.dataset.k, 1); render(); }; });
        } else s.innerHTML = '<span class="ph">' + (expr().trim() ? esc(T.pretty(expr())) : '…') + '</span>';
        live();
      }
      function live() {
        var e = expr(), ok = false, vals = null;
        try { if (e.trim()) { T.parse(e); vals = l.checkNs.map(function (x) { return T.evaluate(e, x); }); } } catch (er) { vals = null; }
        $('#live').innerHTML = '<tr><th>' + (l.kind === 'pattern' ? 'Anzahl' : 'x') + '</th>' + l.checkNs.map(function (x) { return '<th>' + fmt(x) + '</th>'; }).join('') + '</tr>' +
          '<tr><th>echt</th>' + l.checkNs.map(function (x) { return '<td>' + resFmt(l.f(x)) + '</td>'; }).join('') + '</tr>' +
          '<tr><th>dein Term</th>' + l.checkNs.map(function (x, k) { if (!vals) return '<td>?</td>'; var g = T.same(vals[k], l.f(x)); return '<td class="' + (g ? 'ok' : 'no') + '">' + resFmt(vals[k]) + '</td>'; }).join('') + '</tr>';
        $('#slot').classList.remove('good');
        if (!vals || solved) return;
        var r = T.check(e, l.f);
        if (r.status === 'ok') { solved = true; $('#slot').classList.add('good'); setTimeout(function () { win(e); }, 600); }
        else if (r.status === 'almost') { var g = r.rows.filter(function (q) { return q.ok; })[0], b = r.rows.filter(function (q) { return !q.ok; })[0]; say('Fast! Passt bei ' + fmt(g.x) + ', aber nicht bei ' + fmt(b.x) + '. 🔍'); }
        else { clearTimeout(live.t); live.t = setTimeout(function () { if (!solved && expr() === e) say(r.status === 'nox' ? 'Da fehlt noch das <span class="o">x</span>!' : 'Noch nicht. Vergleiche mit „echt“ 👀'); }, 1400); }
      }
      $$('.tile', box).forEach(function (b) {
        b.onclick = function () { if (solved) return; var t = b.dataset.t; if (t === '⌫') tokens.pop(); else tokens.push(t); render(); };
      });
      $('#typeT').onclick = function () {
        typing = !typing; $('#typebox').classList.toggle('hidden', !typing); $('#tiles').classList.toggle('hidden', typing);
        $('#typeT').textContent = typing ? '🧩 Bausteine' : '⌨️ Selbst tippen';
        if (typing) { $('#typed').value = tokens.join(' '); $('#typed').focus(); }
        render();
      };
      $('#typed').addEventListener('input', render);
      $('#hint').onclick = function () { if (hints < 3) hints++; say('💡 ' + l.hints[hints - 1]); if (hints >= 3) $('#hint').disabled = true; };
      render();
    }
    function win(e) {
      streak(true); confetti(120);
      var stars = Math.max(1, 3 - (hints > 0 ? 1 : 0) - (wrongQ >= 2 ? 1 : 0));
      setStars(l.id, stars); phase(4);
      var big = l.quiz[l.quiz.length - 1];
      var others = [l.canon].concat(l.alts).filter(function (t) { return T.normalize(t) !== T.normalize(e); }).slice(0, 2);
      say('Du hast den Term gefunden! 🥳');
      $('#win').innerHTML = '<div class="panel win"><div>' + starsHTML(stars) + '</div><h2>' + (stars === 3 ? 'Perfekt!' : stars === 2 ? 'Super!' : 'Geschafft!') + '</h2>' +
        '<div class="termbig">' + esc(T.pretty(e)) + '</div>' +
        '<div class="proof">Probe: x = ' + big + ' → ' + resFmt(T.evaluate(e, big)) + ' ✔</div>' +
        '<div style="color:#64748b;font-weight:700">Auch richtig: ' + others.join(' &nbsp;|&nbsp; ') + '</div><br>' +
        (i + 1 < LEVELS.length ? '<button class="big green wide" data-next>Nächstes Level ➜</button>' : '') + '<button class="linkbtn" data-home>Übersicht</button></div>';
      wire(i); setTimeout(function () { $('#win').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300);
    }
  }

  /* ---------- Karten: Welcher Term passt? ---------- */
  function figFor(k, n) { return k === 'tables' ? tablesSVG(n) : stickSVG(k, n, { plain: true }); }
  function matchLevel(i) {
    var l = LEVELS[i], q = 0, wrong = 0;
    $('#main').innerHTML = lhead(i, l, false) + mascotHTML('Finde die passenden Karten!').replace('class="mascot"', 'class="mascot sticky"') + '<div class="panel" id="mq"></div><div id="win"></div>';
    wire(i);
    function show() {
      var Q = MATCH[q], good = Q.cards.map(function (c) { return T.check(c, Q.f).status === 'ok'; }), need = good.filter(Boolean).length, found = 0;
      $('#mq').innerHTML = '<div class="dots">' + MATCH.map(function (_, k) { return '<i class="' + (k < q ? 'ok' : k === q ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="q">' + Q.story + '</div>' + (Q.fig ? '<div class="stage">' + figFor(Q.fig, 3) + '</div>' : '') +
        '<div class="q" style="font-size:19px">Finde <b>' + need + '</b> passende Karten 👇</div><div class="cards">' +
        Q.cards.map(function (c, k) {
          var back = good[k] ? '✔ passt!' : '✘ passt nicht<small>bei 1: ' + fmt(T.evaluate(c, 1)) + ' statt ' + fmt(Q.f(1)) + '<br>bei 3: ' + fmt(T.evaluate(c, 3)) + ' statt ' + fmt(Q.f(3)) + '</small>';
          return '<button class="card3d" data-k="' + k + '"><div class="in"><div class="f">' + c + '</div><div class="bk ' + (good[k] ? 'yes' : 'no') + '">' + back + '</div></div></button>';
        }).join('') + '</div><div id="mn"></div>';
      say('Tipp: Setz x = 1 und x = 3 ein!');
      $$('.card3d').forEach(function (b) {
        b.onclick = function () {
          if (b.classList.contains('flip')) return;
          b.classList.add('flip');
          if (good[+b.dataset.k]) { found++; streak(true); say(found < need ? 'Ja! Noch ' + (need - found) + '…' : 'Alle gefunden! 🎉'); }
          else { wrong++; streak(false); say('Leider nicht – schau auf die Rückseite.'); }
          if (found === need) {
            confetti(30); $$('.card3d').forEach(function (c) { c.classList.add('flip'); });
            $('#mn').innerHTML = '<br><button class="big green wide" id="mnext">' + (q + 1 < MATCH.length ? 'Weiter ➜' : 'Fertig ➜') + '</button>';
            $('#mnext').onclick = function () { q++; if (q < MATCH.length) show(); else done(); };
          }
        };
      });
    }
    function done() {
      var stars = wrong === 0 ? 3 : wrong <= 2 ? 2 : 1; setStars(l.id, stars); confetti(120);
      $('#mq').innerHTML = ''; say('Karten-Profi! 🃏');
      $('#win').innerHTML = '<div class="panel win">' + starsHTML(stars) + '<h2>Geschafft!</h2>' + (i + 1 < LEVELS.length ? '<button class="big green wide" data-next>Nächstes Level ➜</button>' : '') + '<button class="linkbtn" data-home>Übersicht</button></div>';
      wire(i);
    }
    show();
  }

  /* ---------- Quiz: Was bedeutet der Term? ---------- */
  function reverseLevel(i) {
    var l = LEVELS[i], q = 0, wrong = 0;
    $('#main').innerHTML = lhead(i, l, false) + mascotHTML('Jetzt andersrum! 🔄').replace('class="mascot"', 'class="mascot sticky"') + '<div class="panel" id="rq"></div><div id="win"></div>';
    wire(i);
    function show() {
      var Q = REVERSE[q], solved = false;
      $('#rq').innerHTML = '<div class="dots">' + REVERSE.map(function (_, k) { return '<i class="' + (k < q ? 'ok' : k === q ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="termbig">' + Q.term + '</div><div class="q" style="font-size:20px">' + Q.q + '</div><div class="opts">' +
        Q.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + o + '</button>'; }).join('') + '</div><div id="rn"></div>';
      $$('.opt', $('#rq')).forEach(function (b) {
        b.onclick = function () {
          if (solved || b.classList.contains('wrong')) return;
          if (+b.dataset.k === Q.ok) {
            solved = true; b.classList.add('right'); streak(true); confetti(14); say('✔ ' + Q.why);
            $('#rn').innerHTML = '<br><button class="big green wide" id="rnext">' + (q + 1 < REVERSE.length ? 'Weiter ➜' : 'Fertig ➜') + '</button>';
            $('#rnext').onclick = function () { q++; if (q < REVERSE.length) show(); else done(); };
          } else { b.classList.add('wrong'); wrong++; streak(false); say('Hmm, nicht ganz. Was wächst mit x? 🤔'); }
        };
      });
    }
    function done() {
      var stars = wrong === 0 ? 3 : wrong <= 2 ? 2 : 1; setStars(l.id, stars); confetti(120);
      $('#rq').innerHTML = ''; say('Du bist ein Term-Profi! 🏆');
      $('#win').innerHTML = '<div class="panel win">' + starsHTML(stars) + '<h2>Geschafft!</h2><button class="linkbtn" data-home>Übersicht</button></div>';
      wire(i);
    }
    show();
  }

  window.TermTrainer = { LEVELS: LEVELS, MATCH: MATCH, REVERSE: REVERSE, openLevel: openLevel, home: home };
  document.addEventListener('DOMContentLoaded', function () { load(); header(); home(); $('#title').onclick = home; });
})();
</script>
